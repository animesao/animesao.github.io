name: Deploy to GitHub Pages

on:
  push:
    branches:
      - source
  pull_request:
    branches:
      - source
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint check
        run: pnpm run lint

      - name: TypeScript typecheck
        run: pnpm run typecheck

      - name: Generate static site (SSG)
        run: pnpm run generate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUXT_PUBLIC_SITE_URL: https://animesao.work.gd

      - name: Ensure CNAME & .nojekyll in build output
        run: |
          echo "animesao.work.gd" > .output/public/CNAME
          touch .output/public/.nojekyll

      - name: Deploy compiled site to main branch
        if: github.ref == 'refs/heads/source'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: main
          publish_dir: .output/public
          cname: animesao.work.gd
          keep_files: false

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/source'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

      - name: Deploy to GitHub Pages (Actions environment)
        if: github.ref == 'refs/heads/source'
        id: deployment
        uses: actions/deploy-pages@v4
